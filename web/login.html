<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - NOVA GMAIL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { direction: rtl; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-900 to-indigo-900 min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-white text-center mb-8">
      <i class="fas fa-envelope-open-text"></i> NOVA GMAIL
    </h1>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-white font-semibold mb-2">البريد الإلكتروني</label>
        <input type="email" id="email" class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="example@gmail.com" required />
      </div>

      <div>
        <label class="block text-white font-semibold mb-2">كلمة المرور</label>
        <input type="password" id="password" class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="••••••••" required />
      </div>

      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
        تسجيل الدخول
      </button>
    </form>

    <p class="text-gray-300 text-center mt-6">ليس لديك حساب؟ <a href="/register.html" class="text-purple-400 hover:text-purple-300">سجل الآن</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!response.ok) throw new Error('فشل تسجيل الدخول');
        
        const data = await response.json();
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } catch (error) {
        alert('❌ ' + error.message);
      }
    });
  </script>
</body>
</html>
