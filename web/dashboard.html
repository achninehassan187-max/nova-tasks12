<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA GMAIL - منصة المهام الدقيقة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      direction: rtl;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .dark-mode {
      background-color: #0f172a;
      color: #e2e8f0;
    }
    .light-mode {
      background-color: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body class="dark-mode transition-all">
  <!-- Navbar -->
  <nav class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-white">
        <i class="fas fa-envelope-open-text"></i> NOVA GMAIL
      </h1>
      <div class="flex gap-4">
        <button id="themeToggle" class="bg-gray-700 hover:bg-gray-600 p-2 rounded-lg transition">
          <i class="fas fa-moon"></i>
        </button>
        <select id="languageSelect" class="bg-gray-700 hover:bg-gray-600 p-2 rounded-lg">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-white transition">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
      </div>
    </div>
  </nav>

  <div class="container mx-auto p-6">
    <!-- Dashboard Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-lg shadow-lg text-white">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm opacity-90">الرصيد الأساسي</p>
            <h2 class="text-3xl font-bold" id="mainBalance">$0.00</h2>
          </div>
          <i class="fas fa-wallet text-4xl opacity-50"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-yellow-500 to-yellow-600 p-6 rounded-lg shadow-lg text-white">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm opacity-90">رصيد الحجز</p>
            <h2 class="text-3xl font-bold" id="escrowBalance">$0.00</h2>
          </div>
          <i class="fas fa-lock text-4xl opacity-50"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-lg shadow-lg text-white">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm opacity-90">المهام المكتملة</p>
            <h2 class="text-3xl font-bold" id="completedTasks">0</h2>
          </div>
          <i class="fas fa-tasks text-4xl opacity-50"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-lg shadow-lg text-white">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm opacity-90">عدد الإحالات</p>
            <h2 class="text-3xl font-bold" id="referralCount">0</h2>
          </div>
          <i class="fas fa-share-alt text-4xl opacity-50"></i>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-4 mb-6 overflow-x-auto">
      <button class="tab-btn active px-6 py-3 bg-purple-600 text-white rounded-lg font-semibold" data-tab="gmail">
        <i class="fas fa-envelope"></i> مهام Gmail
      </button>
      <button class="tab-btn px-6 py-3 bg-gray-700 text-white rounded-lg font-semibold hover:bg-gray-600" data-tab="shortlink">
        <i class="fas fa-link"></i> الروابط
      </button>
      <button class="tab-btn px-6 py-3 bg-gray-700 text-white rounded-lg font-semibold hover:bg-gray-600" data-tab="special">
        <i class="fas fa-star"></i> مهام خاصة
      </button>
      <button class="tab-btn px-6 py-3 bg-gray-700 text-white rounded-lg font-semibold hover:bg-gray-600" data-tab="withdrawals">
        <i class="fas fa-dollar-sign"></i> السحب
      </button>
    </div>

    <!-- Gmail Tab -->
    <div id="gmail-tab" class="tab-content">
      <div class="bg-gray-800 rounded-lg p-6" id="gmailTasksContainer">
        جاري تحميل المهام...
      </div>
    </div>

    <!-- Shortlink Tab -->
    <div id="shortlink-tab" class="tab-content hidden">
      <div class="bg-gray-800 rounded-lg p-6" id="shortlinkTasksContainer">
        جاري تحميل المهام...
      </div>
    </div>

    <!-- Special Tab -->
    <div id="special-tab" class="tab-content hidden">
      <div class="bg-gray-800 rounded-lg p-6" id="specialTasksContainer">
        جاري تحميل المهام...
      </div>
    </div>

    <!-- Withdrawals Tab -->
    <div id="withdrawals-tab" class="tab-content hidden">
      <div class="bg-gray-800 rounded-lg p-6">
        <h3 class="text-xl font-bold text-white mb-4">💵 طلب سحب</h3>
        <form id="withdrawalForm" class="space-y-4">
          <input type="number" id="withdrawAmount" min="0.45" step="0.01" class="w-full bg-gray-700 text-white p-3 rounded-lg" placeholder="المبلغ" required />
          <select id="withdrawMethod" class="w-full bg-gray-700 text-white p-3 rounded-lg" required>
            <option value="">اختر الطريقة</option>
            <option value="usdt">🪙 USDT</option>
            <option value="novabot">🤖 Nova Bot</option>
            <option value="stars">⭐ النجوم</option>
          </select>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">سحب</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../public/app.js"></script>
</body>
</html>
